name: Build and Publish Extensions

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEY_BASE64" ]; then
            echo "$SIGNING_KEY_BASE64" | base64 -d > signingkey.jks
          fi

      - name: Build release extension APKs
        run: ./gradlew assembleRelease --no-daemon

      - name: Generate extension repository index
        run: python3 scripts/generate_repo.py

      - name: Deploy to HikariCollection/extensions (repo branch)
        uses: peaceiris/actions-gh-pages@v4
        if: github.repository == 'HikariCollection/extensions-source' && github.ref == 'refs/heads/main'
        with:
          personal_token: ${{ secrets.EXTENSIONS_REPO_TOKEN }}
          external_repository: HikariCollection/extensions
          publish_branch: repo
          publish_dir: ./repo
          force_orphan: true
